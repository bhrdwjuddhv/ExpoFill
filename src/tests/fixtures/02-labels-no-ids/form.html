<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CodeSprint 2026 - Student Registration</title></head>
<body>
  <h1>CodeSprint 2026</h1>
  <h2>Student Registration</h2>
  <form>
    <div class="row"><label>Full Name</label><input type="text"></div>
    <div class="row"><label>Email</label><input type="email"></div>
    <div class="row"><label>Phone Number</label><input type="tel"></div>
    <div class="row"><label>College / University</label><input type="text"></div>
    <div class="row"><label>Course</label><input type="text"></div>
    <div class="row">
      <label>Year of Study</label>
      <select><option value="">Select</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
    </div>
    <div class="row"><label>City</label><input type="text"></div>
    <div class="row"><label>GitHub Profile</label><input type="url"></div>
    <div class="row"><label>Why do you want to attend?</label><textarea rows="4"></textarea></div>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
