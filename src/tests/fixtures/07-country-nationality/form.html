<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Global Edu Fair 2026 | Register</title></head>
<body>
  <form>
    <label>Full name <input name="fullname"></label>
    <label>Nationality
      <select name="nationality"><option>Select</option><option>Indian</option><option>American</option><option>British</option></select>
    </label>
    <label>Country of Residence
      <select name="country">
        <option value="">Select country</option><option value="IN">India</option><option value="US">United States</option><option value="GB">United Kingdom</option>
      </select>
    </label>
    <label>Country Code
      <select name="cc"><option value="+91">India (+91)</option><option value="+1">USA (+1)</option><option value="+44">UK (+44)</option></select>
    </label>
    <label>Phone <input type="tel" name="phone"></label>
    <label>Citizenship <input name="citizenship"></label>
    <label>State / Province <input name="state"></label>
    <label>Postal Code <input name="zip" autocomplete="postal-code"></label>
    <button>Register</button>
  </form>
</body>
</html>
