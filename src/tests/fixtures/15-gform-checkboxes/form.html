<script>
// Google Forms behaviour: radios are exclusive within a radiogroup, checkboxes toggle.
document.addEventListener('click', (e) => {
  const radio = e.target.closest('[role=radio]');
  if (radio) radio.closest('[role=radiogroup]').querySelectorAll('[role=radio]').forEach((r) => r.setAttribute('aria-checked', String(r === radio)));

  if (box) box.setAttribute('aria-checked', String(box.getAttribute('aria-checked') !== 'true'));
});
