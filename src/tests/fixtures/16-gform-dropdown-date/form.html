<script>
// Google Forms dropdown: click opens, click on an option selects it and shows it.
document.querySelectorAll('[role=listbox]').forEach((lb) => {
  lb.addEventListener('click', (e) => {
    const opt = e.target.closest('[role=option]');
    if (!opt) { lb.setAttribute('aria-expanded', 'true'); return; }
    lb.querySelectorAll('[role=option]').forEach((o) => o.setAttribute('aria-selected', String(o === opt)));
    lb.setAttribute('aria-expanded', 'false');
  });
});
</script>
