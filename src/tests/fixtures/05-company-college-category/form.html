<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>National Cyber Summit 2026 — Delegate Registration</title></head>
<body>
  <h1>National Cyber Summit 2026</h1>
  <form>
    <h3>Delegate details</h3>
    <p><label for="n">Name</label><input id="n" name="name"></p>
    <p><label for="co">Company</label><input id="co" name="company"></p>
    <p><label for="cl">College</label><input id="cl" name="college"></p>
    <p><label for="d">Designation</label><input id="d" name="designation"></p>
    <p><label for="dept">Department</label><input id="dept" name="department"></p>
    <p>
      <label for="rc">Registration Category</label>
      <select id="rc" name="reg_category">
        <option value="">-- Select --</option><option>Student</option><option>Working Professional</option>
        <option>Startup Founder</option><option>Faculty</option>
      </select>
    </p>
    <p>
      <label for="ticket">Ticket Type</label>
      <select id="ticket" name="ticket"><option>Free Pass</option><option>VIP Pass</option></select>
    </p>
    <p><label for="exp">Total work experience (years)</label><input id="exp" name="experience" type="number"></p>
    <p><label for="ind">Industry</label><input id="ind" name="industry"></p>
    <p><label for="startup">Startup name (if any)</label><input id="startup" name="startup_name"></p>
    <button type="submit">Register</button>
  </form>
</body>
</html>
